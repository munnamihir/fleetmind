{{- if .Values.assetSimulator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-asset-simulator
  labels:
    {{- include "fleetmind.labels" . | nindent 4 }}
    app.kubernetes.io/component: asset-simulator
spec:
  replicas: {{ .Values.assetSimulator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: asset-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: asset-simulator
    spec:
      containers:
        - name: asset-simulator
          image: {{ .Values.assetSimulator.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-fleetmind
          env:
            - name: ASSET_SIMULATED_ASSETS
              value: {{ .Values.assetSimulator.assetCount | quote }}
            - name: ASSET_SIM_EVENTS_PER_SECOND
              value: {{ .Values.assetSimulator.eventsPerSecond | quote }}
{{- end }}
