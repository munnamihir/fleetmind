services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetmind}
      POSTGRES_USER: ${POSTGRES_USER:-fleetmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetmind}
    ports:
      - "5432:5432"
    volumes:
      - fleetmind-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fleetmind} -d ${POSTGRES_DB:-fleetmind}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092

    ports:
      - "19092:19092"
      - "9644:9644"

    volumes:
      - fleetmind-redpanda:/var/lib/redpanda/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk topic list --brokers localhost:9092 >/dev/null 2>&1 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  topic-init:
    image: redpandadata/redpanda:v24.3.1

    depends_on:
      redpanda:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Ensuring FleetMind Kafka topics exist..."

        rpk topic create "$${TELEMETRY_TOPIC}" \
          --partitions 3 \
          --replicas 1 \
          --brokers redpanda:9092 \
          2>/dev/null || true

        rpk topic create "$${FAILURE_TOPIC}" \
          --partitions 3 \
          --replicas 1 \
          --brokers redpanda:9092 \
          2>/dev/null || true

        rpk topic describe "$${TELEMETRY_TOPIC}" \
          --brokers redpanda:9092 >/dev/null

        rpk topic describe "$${FAILURE_TOPIC}" \
          --brokers redpanda:9092 >/dev/null

        echo "FleetMind Kafka topics ready."

    environment:
      TELEMETRY_TOPIC: ${TELEMETRY_TOPIC:-vehicle.telemetry.v1}
      FAILURE_TOPIC: ${FAILURE_TOPIC:-vehicle.failure-events.v1}

    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fleetmind:fleetmind@postgres:5432/fleetmind}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fleetmind:fleetmind@postgres:5432/fleetmind}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}

      TELEMETRY_TOPIC: ${TELEMETRY_TOPIC:-vehicle.telemetry.v1}

      FAILURE_TOPIC: ${FAILURE_TOPIC:-vehicle.failure-events.v1}

      PYTHONUNBUFFERED: "1"

    depends_on:
      postgres:
        condition: service_healthy

      redpanda:
        condition: service_healthy

      topic-init:
        condition: service_completed_successfully

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      TELEMETRY_TOPIC: ${TELEMETRY_TOPIC:-vehicle.telemetry.v1}
      FAILURE_TOPIC: ${FAILURE_TOPIC:-vehicle.failure-events.v1}
      SIMULATED_VEHICLES: ${SIMULATED_VEHICLES:-500}
      SIM_EVENTS_PER_SECOND: ${SIM_EVENTS_PER_SECOND:-120}
      SIM_TIME_ACCELERATION: ${SIM_TIME_ACCELERATION:-600}
      PYTHONUNBUFFERED: "1"

    depends_on:
      redpanda:
        condition: service_healthy

      topic-init:
        condition: service_completed_successfully


  ml-trainer:
    build:
      context: .
      dockerfile: services/ml/Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fleetmind:fleetmind@postgres:5432/fleetmind}

      ML_FAILURE_HORIZON_MILES: ${ML_FAILURE_HORIZON_MILES:-2500}
      ML_WINDOW_SIZE: ${ML_WINDOW_SIZE:-12}
      ML_WINDOW_STRIDE: ${ML_WINDOW_STRIDE:-4}

      ML_MAX_EXAMPLES_PER_VEHICLE: ${ML_MAX_EXAMPLES_PER_VEHICLE:-32}
      ML_MAX_TELEMETRY_ROWS: ${ML_MAX_TELEMETRY_ROWS:-250000}

      ML_MIN_TRAIN_EXAMPLES: ${ML_MIN_TRAIN_EXAMPLES:-500}
      ML_MIN_TRAIN_POSITIVES: ${ML_MIN_TRAIN_POSITIVES:-5}
      ML_MIN_TEST_EXAMPLES: ${ML_MIN_TEST_EXAMPLES:-80}

      ML_STARTUP_DELAY_SECONDS: ${ML_STARTUP_DELAY_SECONDS:-20}
      ML_TRAIN_INTERVAL_SECONDS: ${ML_TRAIN_INTERVAL_SECONDS:-90}

      ML_ARTIFACT_DIR: /artifacts

      PYTHONUNBUFFERED: "1"

    volumes:
      - fleetmind-ml-artifacts:/artifacts

    depends_on:
      postgres:
        condition: service_healthy

      simulator:
        condition: service_started

      worker:
        condition: service_started


  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    ports:
      - "5173:5173"

    depends_on:
      - api


volumes:
  fleetmind-postgres:
  fleetmind-redpanda:
  fleetmind-ml-artifacts: