global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fleetmind-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - redpanda:9644
